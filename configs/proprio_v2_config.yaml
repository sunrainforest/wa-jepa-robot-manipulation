paths:
  model_dir: ../artifacts/stage1_robot
  action_dataset: ../data/cube-single-play-v0.npz
  source_latent_cache: ../data/wajepa_cube_semantic_latents.npz
  complete_trajectory_dataset: ../data/wajepa_recovery_temporal_proprio_latents.npz
  output_dir: ../runs/lewm_architecture_wajepa

seed: 42
device: cuda
image_size: 224

task:
  name: proprio_v2_cube
  init_xyz: [0.40, -0.15, 0.02]
  goal_xyz: [0.35, 0.20, 0.02]

# Coordinates/contact are used only to create offline labels and the one-time
# target RGB. They are never included in runtime model inputs.
labels:
  xy_alignment_m: 0.04
  xyz_alignment_m: 0.035
  contact_threshold: 0.50
  closed_gripper_threshold: 0.45

model:
  latent_dim: 384
  hidden_dim: 384
  action_dim: 5
  action_block: 5
  state_count: 3
  predicate_count: 2
  proprio_dim: 6
  value_ensemble_size: 2
  # XYZ deltas induced by one normalized robot action. Yaw/gripper are updated
  # analytically in imagined rollouts.
  xyz_action_scale: [0.5, 0.5, 0.5]
  proprio_min: [-3.0, -5.0, 0.0, -1.0, -1.0, 0.0]
  proprio_max: [3.0, 5.0, 5.0, 1.0, 1.0, 1.0]

offline_training:
  epochs: 35
  batch_size: 512
  learning_rate: 0.0002
  weight_decay: 0.00001
  validation_fraction: 0.10
  gamma: 0.97
  target_tau: 0.01
  semantic_coefficient: 2.0
  transition_coefficient: 1.0
  target_coefficient: 1.5
  actor_coefficient: 2.0
  critic_coefficient: 0.5
  step_penalty: 0.01
  state_transition_reward: 0.25
  recovery_penalty: 0.05
  max_positive_weight: 20.0
  max_grad_norm: 1.0

# Every frame from each complete expert trajectory is used. No frame sampling.
# Validation is split by whole episode, never by individual frame.
task_finetuning:
  episodes: 64
  max_collection_attempts: 128
  max_steps: 150
  seed_offset: 17000
  action_noise_std: 0.02
  epochs: 80
  batch_size: 128
  learning_rate: 0.0002
  validation_fraction: 0.20
  reuse_dataset: false

planner:
  num_candidates: 96
  horizon_blocks: 5
  exploration_std: 0.08
  exploration_decay: 0.98
  execute_steps_by_state: [1, 1, 1]
  short_target_coefficient: 0.85
  terminal_value_coefficient: 0.70
  trajectory_value_coefficient: 0.15
  uncertainty_coefficient: 0.20
  action_prior_coefficient: 5.0
  action_smoothness_coefficient: 0.02
  action_blend: [0.15, 0.15, 0.10, 0.05, 0.0]
  elite_count: 8
  elite_temperature: 0.05

# Diagnostic only: substitute a true future latent from the nearest matching
# successful trajectory. Disabled by default so the original baseline is unchanged.
oracle_subgoal:
  enabled: false
  enabled_states: [transfer]
  lookahead_steps_by_state: [10, 10, 25]
  freeze_actor: true
  confidence_gate:
    enabled: false
    # 99th percentile of cross-episode nearest-neighbor MSE over the 64
    # successful offline TRANSFER trajectories (calibrated without test runs).
    match_mse_threshold: 0.0031

latent_subgoal_planner:
  enabled: false
  shadow_mode: true
  control_mode: false
  checkpoint_name: latent_subgoal_planner_h25.pt
  prediction_manifold_mse_threshold: 0.0031
  lookahead_steps: 25
  hidden_dim: 512
  phase_embedding_dim: 16
  epochs: 250
  batch_size: 128
  learning_rate: 0.0002
  weight_decay: 0.00001
  validation_fraction: 0.20
  split_seed_offset: 31000
  early_stopping_patience: 35
  max_grad_norm: 1.0

state_machine:
  aligned_enter_threshold: 0.65
  aligned_exit_threshold: 0.35
  grasp_enter_threshold: 0.55
  grasp_exit_threshold: 0.35
  gripper_closed_threshold: 0.45
  transition_model_confidence: 0.40
  aligned_confirm_frames: 2
  grasp_confirm_frames: 1
  lost_alignment_frames: 3
  lost_grasp_frames: 4
  state_cooldown_steps: 2
  max_align_steps: 90
  max_grasp_steps: 55

transfer_goal:
  reference_seed: 15000
  max_steps: 180
  goal_xyz_m: 0.04
  latent_mse_threshold: 0.017
  complete_consecutive_frames: 2

online_training:
  enable_updates: true
  episodes: 10
  max_steps: 300
  seed_offset: 11000
  learning_rate: 0.000001
  updates_per_step: 1
  replay_capacity: 4096
  warmup_samples: 8
  batch_size: 64
  minimum_planner_advantage: 0.005
  minimum_semantic_progress: 0.002
  bc_anchor_coefficient: 1.0
  max_grad_norm: 1.0
  fps: 20
